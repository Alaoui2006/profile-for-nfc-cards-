<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#307dc5">
<title>جمعية أمان الخيرية | Aman Charity Association</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#307dc5; --blue-d:#1d5a9c; --navy:#0f3c6e; --sky:#eaf3fb; --white:#fff;
  --ink:#16324f; --muted:#5d7690;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(170deg,var(--blue) 0%,var(--blue-d) 60%,var(--navy) 100%);
  color:var(--ink); overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
#bubbles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---------- hero ---------- */
.hero{padding:34px 24px 70px;text-align:center;color:#fff}
.logo-stage{position:relative;width:170px;height:170px;margin:0 auto 18px;perspective:600px}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ripple 3.6s ease-out infinite;opacity:0}
.ring:nth-child(2){animation-delay:1.2s}.ring:nth-child(3){animation-delay:2.4s}
@keyframes ripple{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.logo{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  border:4px solid rgba(255,255,255,.95);
  box-shadow:0 14px 40px rgba(6,30,60,.45),0 0 0 8px rgba(255,255,255,.12);
  background:var(--blue);transition:transform .15s ease-out;transform-style:preserve-3d;
  animation:floaty 5s ease-in-out infinite;
}
.logo img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;transform:scale(1.55);transform-origin:50% 36%}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -8px}}
.hero h1{font-size:26px;font-weight:800;letter-spacing:.2px;margin-bottom:2px}
.hero .en{font-size:14px;font-weight:600;opacity:.9;letter-spacing:1.2px;direction:ltr}
.tag{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.35);font-size:13px;font-weight:600;backdrop-filter:blur(6px)}

/* ---------- sheet ---------- */
.sheet{
  flex:1;background:#fff;border-radius:34px 34px 0 0;margin-top:-38px;padding:26px 20px calc(30px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 40px rgba(6,30,60,.25);position:relative;
}
.sheet::before{content:"";position:absolute;top:10px;left:50%;width:46px;height:5px;border-radius:9px;background:#d5e3f1;translate:-50% 0}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* save button */
.save{
  text-decoration: none;
  position: relative;
  overflow: hidden;
  width: 100%;
  border: 0;
  cursor: pointer;
  margin-top: 10px;
  position:relative;overflow:hidden;width:100%;border:0;cursor:pointer;margin-top:10px;
  padding:17px 20px;border-radius:18px;color:#fff;font:800 18px 'Cairo',sans-serif;
  background:linear-gradient(135deg,var(--blue),var(--blue-d));
  box-shadow:0 10px 24px rgba(48,125,197,.45);display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .15s;
}
.save:active{transform:scale(.97)}
.save::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.save svg{width:24px;height:24px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* info rows */
.rows{margin-top:20px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--sky);
  text-decoration:none;color:inherit;border:1px solid #d9e8f6;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.row:active{transform:scale(.98)}
.row:hover{box-shadow:0 8px 20px rgba(48,125,197,.18)}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff}
.ico svg{width:24px;height:24px}
.row small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.row b{display:block;font-size:15px;font-weight:700;direction:ltr;text-align:right;word-break:break-all}
.row .go{margin-inline-start:auto;color:var(--blue);opacity:.7}
.row .go svg{width:20px;height:20px;transform:scaleX(-1)}

/* socials */
.sec-title{margin:26px 4px 12px;font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:10px}
.sec-title::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,#cfe0f1,transparent)}
.socials{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.soc{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;color:#fff;text-decoration:none;
  background:linear-gradient(135deg,var(--blue),var(--navy));box-shadow:0 8px 18px rgba(29,90,156,.3);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.soc:hover{transform:translateY(-5px) rotate(-4deg)}
.soc:active{transform:scale(.9)}
.soc svg{width:26px;height:26px}
.names{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px;text-align:center;font-size:10.5px;color:var(--muted);font-weight:600}

footer{margin-top:28px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
footer span{color:var(--blue);font-weight:800}

/* ripple + toast */
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(3.2);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));translate:-50% 120px;z-index:9;
  background:var(--navy);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);transition:translate .45s cubic-bezier(.2,1.2,.4,1);white-space:nowrap}
.toast.show{translate:-50% 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<script>
/* ============ بيانات الاتصال — بدّل النمرة هنا ============ */
const CONTACT = {
  org:   "جمعية أمان الخيرية",
  orgEn: "Aman Charity Association",
  phone: "0672761606",                                   // مثال: "+212600000000"  (خليها خاوية إلا ما بغيتيش النمرة)
  email: "amancharityas@gmail.com",
  site:  "https://aman-charity.com/",
  place: "VC4C+WHM, Meknès, Maroc",
  city:  "Meknès", country: "Maroc",
  socials: [
    "https://www.instagram.com/amancharityas",
    "https://www.facebook.com/amancharityas",
    "https://www.linkedin.com/company/amancharityas/",
    "https://youtube.com/@amancharityas",
    "https://www.tiktok.com/@amancharity"
  ]
};


/* ============ Map link ============ */
document.getElementById('mapLink').href =
  "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("VC4C+WHM? Meknés, Maroc");

/* ============ vCard (.vcf) ============ */



/* ============ Toast ============ */
const toast=document.getElementById('toast');let tt;
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2600)}

/* ============ Ripple على الضغط ============ */
function addRipple(e){
  const el=e.currentTarget, r=el.getBoundingClientRect(), s=Math.max(r.width,r.height)*.5;
  const d=document.createElement('span'); d.className='rp';
  d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  el.appendChild(d); setTimeout(()=>d.remove(),650);
}
document.querySelectorAll('.save,.row').forEach(el=>el.addEventListener('pointerdown',addRipple));

document.getElementById('saveBtn').addEventListener('click',()=>{
  showToast('✅ تحمّلات جهة الاتصال');
});

/* ============ Reveal متتابع ============ */
window.addEventListener('load',()=>{
  document.querySelectorAll('.reveal').forEach((el,i)=>setTimeout(()=>el.classList.add('in'),150+i*110));
});



/* ============ فقاعات الماء الطايرة (canvas) ============ */
(function(){
  const c=document.getElementById('bubbles'),x=c.getContext('2d');
  let W,H,dpr=Math.min(window.devicePixelRatio||1,2),B=[];
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  const N=Math.round(Math.min(34,W/12));
  const mk=(init)=>({x:Math.random()*W,y:init?Math.random()*H:H+20,r:3+Math.random()*13,
    v:.25+Math.random()*.7,s:Math.random()*Math.PI*2,a:.07+Math.random()*.16});
  for(let i=0;i<N;i++)B.push(mk(true));
  function frame(t){
    x.clearRect(0,0,W,H);
    for(const b of B){
      b.y-=b.v; b.x+=Math.sin(t/1200+b.s)*.35;
      if(b.y<-30){Object.assign(b,mk(false))}
      x.beginPath();x.arc(b.x,b.y,b.r,0,7);
      x.fillStyle=`rgba(255,255,255,${b.a*.5})`;x.fill();
      x.lineWidth=1.2;x.strokeStyle=`rgba(255,255,255,${b.a*1.8})`;x.stroke();
      x.beginPath();x.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.22,0,7);x.fillStyle=`rgba(255,255,255,${b.a*2.2})`;x.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
